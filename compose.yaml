services:
  banco:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: vandershop
      MYSQL_USER: vandershop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Preencha MYSQL_ROOT_PASSWORD no .env}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_dados:/var/lib/mysql
      - ./banco:/docker-entrypoint-initdb.d:ro

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

volumes:
  mysql_dados: